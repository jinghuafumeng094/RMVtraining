%YAML:1.0
---
# 相机标定配置。任务书 §3.3 产出 / §6 提交物。
#
# 两个坐标系的轴向约定。`云台外参.md:22` 要求提交材料必须说明。
#   相机坐标系：x 向右、y 向下、z 沿光轴向前，OpenCV 针孔模型的标准约定
#   云台坐标系：x 向右、y 向下、z 向前，与相机系各轴同向，只有原点不同
#
#   依据：学长 2026-10-10 答复「相机系和云台系只有平移、没有旋转」。
#   把云台系定义为与相机系各轴同向、原点取云台旋转中心，则旋转外参恒为单位阵。
#
#   这是「约定」，不是「缺省占位值」。另有一套同样自洽的约定是枪管系，
#   x 前 / y 左 / z 上，见 armor/include/BulletModel.hpp:6，此时 R 是 90° 置换矩阵。
#   本文件采用前者。两套都合法，作业只要求"说明各轴方向"，未规定用哪一套。
calibrated: 1

# 标定图像分辨率，单位 pixel。
# 内参与第一次标定同一分辨率，2026-10-13 确认。主点 (749.4, 574.7) 相对画面中心
# (720, 540) 偏 (29, 35) px，与上一轮的偏心量同量级，自洽。
# 若车上改用别的分辨率，fx/fy/cx/cy 要一起换算；只有新分辨率是标定图的纯缩放
# 才能同乘一个比例，若是 ROI 裁切则 cx/cy 的偏移量要单独算。
image_width: 1440
image_height: 1080

# 相机内参矩阵 K。
# 来源：第二阶段上车那台相机的内参，2026-10-13 替换掉原先的 2026-10-10 本机标定值。
#   旧值（本机标定，仅供对照）：fx 1806.7 / fy 1804.4 / cx 743.4 / cy 526.1。
#
# 判据不是重投影误差，而是画面四角的径向缩放因子 1+k1r²+k2r⁴+k3r⁶（系数见畸变一节）：
# 新系数按 1440x1080 算，四角为 0.998~1.004，正常镜头落在 0.98~1.02。
# 低重投影误差 ≠ 标定正确：上一轮误差 0.0753 px 看着很好，四角却缩到 0.66，
# 只因棋盘格仅覆盖画面 44% 半径、高阶系数外推无约束。
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1782.6,    0.0,  749.4,
             0.0, 1784.3,  574.7,
             0.0,    0.0,    1.0 ]

# 畸变系数，顺序 [k1, k2, p1, p2, k3]，OpenCV pinhole 模型。
# 来源同上，第二阶段上车相机内参，2026-10-13 替换。
#   旧值（本机标定，仅供对照）：[ -0.0818, 0.1680, 0.0, 0.0, -0.0283 ]。
# k3 = 1.1905 比常见值大，但按 1440x1080 的四角算，1+k1r²+k2r⁴+k3r⁶ 落在 0.998~1.004，
# 高阶项与低阶项互相抵消，没有外推失控。
# p1 = p2 = 0 是标定未估计切向畸变所致，切向填 0 在 OpenCV 针孔模型中是完全合法的取值。
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.0357, -0.1533, 0.0, 0.0, 1.1905 ]

# 相机坐标系 -> 云台坐标系的旋转矩阵 R_gimbal_camera。
# 按上面的轴向约定，两系各轴同向，故取单位阵。刚体变换要求正交且 det = +1，成立。
#
# 本项与「相机光轴是否与枪管平行」是两回事，别混。
#    若相机支架本身存在安装偏角，那是一个真实的物理旋转，与坐标系怎么命名无关，
#    需另行标定，固定棋盘格 + 云台扫位姿 + cv::calibrateHandEye；R = I 只覆盖"命名"这一层。
rotation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1., 0., 0.,
          0., 1., 0.,
          0., 0., 1. ]

# 相机原点在云台坐标系中的位置 t_gimbal_camera，单位为 m。
# 本字段定义：从云台原点指向相机原点的向量，见 config/camera.yaml.example 与本结构体注释。
#
# 取值来源：`云台外参.md` 给出的 云台 P 轴 -> 相机光心 = (67.11, 0, 51.5) mm。
#
# 学长 2026-10-13 答：外参是"云台 P 轴到相机光心"。本字段定义（从云台原点指向
# 相机原点，云台原点取 P 轴）与之同向，所以按学长所说，这三个数即本字段的值，
# 不取负：
#   t = (67.11, 0, 51.5) mm = (0.06711, 0, 0.0515) m
#
# ⚠ 与 handout 正文有出入，待一句确认：`云台外参.md` 把这组数写成
# "相机光心到云台 P 轴"的向量，方向与本字段定义相反，按那句读应取负号
# (-0.06711, 0, -0.0515)。两处只能有一个对，本文件依学长的说法取正号。
# `docs/答辩-位姿解算.md` 的 §1.2、§1.3 与俯视图仍按负号画的，确认后需统一。
#
# 另：handout 未说明这三个分量在哪个坐标系里量的。R = I 时两系同向、不影响；
# 若相机支架确有安装偏角使 R != I，需再确认。
translation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ 0.06711, 0.0, 0.0515 ]

# 标定结果记录：标定那一次的平均重投影误差，单位 pixel。
# 它是标定工具输出的拟合残差，与运行时的 ArmorPose::reprojection_error 不是同一个量。
# 下面的 0.0753 是 2026-10-10 那轮本机标定的数，不是车上这轮内参的；车上那轮的值未取。
# 该字段被 src/AutoAimTypes.cpp:32 校验为必须 >= 0，无法用 -1 占位，故仍留旧值。
# 报告不使用这个数。
mean_reprojection_error_px: 0.0753

%YAML:1.0
---
# 相机标定配置。任务书 §3.3 产出 / §6 提交物。
#
# 两个坐标系的轴向约定。`云台外参.md:22` 要求提交材料必须说明。
#   相机坐标系：x 向右、y 向下、z 沿光轴向前，OpenCV 针孔模型的标准约定
#   云台坐标系：x 向右、y 向下、z 向前，与相机系各轴同向，只有原点不同
#
#   依据：学长 2026-10-10 答复「相机系和云台系只有平移、没有旋转」。
#   把云台系定义为与相机系各轴同向、原点取云台旋转中心，则旋转外参恒为单位阵。
#
#   这是「约定」，不是「缺省占位值」。另有一套同样自洽的约定是枪管系，
#   x 前 / y 左 / z 上，见 armor/include/BulletModel.hpp:6，此时 R 是 90° 置换矩阵。
#   本文件采用前者。两套都合法，作业只要求"说明各轴方向"，未规定用哪一套。
calibrated: 1

# 标定图像分辨率，单位 pixel。
image_width: 1440
image_height: 1080

# 相机内参矩阵 K。
# 来源：2026-10-10 MATLAB R2024b cameraCalibrator，99 张棋盘格，9x12 方块、25 mm/格。
# 判据不是重投影误差，而是画面四角的径向缩放因子 1+k1r²+k2r⁴+k3r⁶：
# 第二轮四角均为 0.9896，正常镜头落在 0.98~1.02。第一轮误差同样 0.0753 px 但四角缩到 0.66，
# 只因棋盘格仅覆盖画面 44% 半径、高阶系数外推无约束。低重投影误差 ≠ 标定正确。
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1806.7,    0.0,  743.4,
             0.0, 1804.4,  526.1,
             0.0,    0.0,    1.0 ]

# 畸变系数，顺序 [k1, k2, p1, p2, k3]，OpenCV pinhole 模型。
# p1 = p2 = 0 是 MATLAB 默认不估计切向畸变所致，EstimateTangentialDistortion = false，
# 不是配置错误；切向填 0 在 OpenCV 针孔模型中是完全合法的取值。
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.0818, 0.1680, 0.0, 0.0, -0.0283 ]

# 相机坐标系 -> 云台坐标系的旋转矩阵 R_gimbal_camera。
# 按上面的轴向约定，两系各轴同向，故取单位阵。刚体变换要求正交且 det = +1，成立。
#
# 本项与「相机光轴是否与枪管平行」是两回事，别混。
#    若相机支架本身存在安装偏角，那是一个真实的物理旋转，与坐标系怎么命名无关，
#    需另行标定，固定棋盘格 + 云台扫位姿 + cv::calibrateHandEye；R = I 只覆盖"命名"这一层。
rotation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1., 0., 0.,
          0., 1., 0.,
          0., 0., 1. ]

# 相机原点在云台坐标系中的位置 t_gimbal_camera，单位为 m。
# 本字段定义：从云台原点指向相机原点的向量，见 config/camera.yaml.example 与本结构体注释。
#
# 取值来源：`云台外参.md` 的 相机光心 -> 云台 P 轴 = (67.11, 0, 51.5) mm。
#
# 学长 2026-10-13 确认：外参即"云台 P 轴到相机光心"，与本字段定义（从云台原点
# 指向相机原点，云台原点取 P 轴）同向，所以 handout 那三个数就是本字段的值，
# 不再取负：
#   t = (67.11, 0, 51.5) mm = (0.06711, 0, 0.0515) m
# 分量按上面声明的云台系解释。R = I 时"在哪个系量的"不影响结果；若日后相机支架
# 确有安装偏角使 R != I，这一条需另行确认。
translation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ 0.06711, 0.0, 0.0515 ]

# 标定结果记录：99 张图的平均重投影误差，单位 pixel。
mean_reprojection_error_px: 0.0753

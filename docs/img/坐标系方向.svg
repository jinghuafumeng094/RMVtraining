<?xml version="1.0" encoding="UTF-8"?>
<!--
  坐标轴方向图 —— 任务书 §3.5「在报告中画出坐标轴方向」。

  三个坐标系：相机系、云台系、物体系。
  数值全部取自 config/camera.yaml：
    内参加畸变      camera_matrix / distortion_coefficients
    相机系 -> 云台系  rotation_camera_to_gimbal 是 90 度置换矩阵（两系不同向）
                    translation_camera_to_gimbal = (0.06711, 0, 0.0515) m
  云台系取 前 左 上，与 armor/include/BulletModel.hpp 的弹道系（世界系）轴向相同。
  依据是学长 2026.10.15 的答复「云台系和世界系一样」，推导见 docs/上车前问题清单.md 第 1.1 节。
  改 camera.yaml 里 R 或 t，这张图上的标注也要跟着改。

  编辑方式：直接改这个 svg，然后跑同目录的 render.sh 重新导出 png。
  注意 XML 注释里不能出现连续两个减号，写分隔线用等号。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080"
     font-family="Noto Sans CJK SC, Noto Sans CJK HK, sans-serif">

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d02a2a"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f8a3c"/>
    </marker>
    <marker id="az" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd0"/>
    </marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c08000"/>
    </marker>
  </defs>

  <rect width="1200" height="1080" fill="#ffffff"/>

  <!-- ================= 标题 ================= -->
  <text x="60" y="54" font-size="27" font-weight="bold" fill="#111">
    三个坐标系的方向与原点关系
  </text>
  <text x="60" y="84" font-size="16" fill="#555">
    任务书 §3.5「将相机坐标系结果转换至约定的云台 / 世界坐标系，并在报告中画出坐标轴方向」
  </text>
  <line x1="60" y1="102" x2="1140" y2="102" stroke="#ccc" stroke-width="1"/>

  <!-- ================= (a) 三个坐标系的轴向 ================= -->
  <text x="60" y="136" font-size="20" font-weight="bold" fill="#111">
    (a) 三个坐标系各轴的方向
  </text>

  <!-- 相机坐标系 -->
  <text x="170" y="172" font-size="17" font-weight="bold" fill="#222">相机坐标系</text>
  <text x="170" y="194" font-size="14" fill="#666">原点 = 相机光心</text>
  <g stroke-linecap="round" stroke-width="2.6" fill="none">
    <line x1="190" y1="300" x2="310" y2="300" stroke="#d02a2a" marker-end="url(#ax)"/>
    <line x1="190" y1="300" x2="190" y2="420" stroke="#1f8a3c" marker-end="url(#ay)"/>
    <line x1="190" y1="300" x2="280" y2="222" stroke="#2b5fd0" marker-end="url(#az)"/>
  </g>
  <circle cx="190" cy="300" r="4" fill="#222"/>
  <text x="320" y="313" font-size="16" fill="#d02a2a">x 向右</text>
  <text x="178" y="442" font-size="16" fill="#1f8a3c">y 向下</text>
  <text x="288" y="250" font-size="16" fill="#2b5fd0">z 沿光轴向前</text>

  <!-- 云台坐标系 -->
  <text x="560" y="172" font-size="17" font-weight="bold" fill="#222">云台坐标系</text>
  <text x="560" y="194" font-size="14" fill="#666">原点 = 云台旋转中心（P 轴）</text>
  <g stroke-linecap="round" stroke-width="2.6" fill="none">
    <line x1="580" y1="300" x2="700" y2="300" stroke="#d02a2a" marker-end="url(#ax)"/>
    <line x1="580" y1="300" x2="500" y2="378" stroke="#1f8a3c" marker-end="url(#ay)"/>
    <line x1="580" y1="300" x2="580" y2="238" stroke="#2b5fd0" marker-end="url(#az)"/>
  </g>
  <circle cx="580" cy="300" r="4" fill="#222"/>
  <text x="712" y="313" font-size="16" fill="#d02a2a">x 向前</text>
  <text x="490" y="404" font-size="16" fill="#1f8a3c" text-anchor="end">y 向左</text>
  <text x="592" y="234" font-size="16" fill="#2b5fd0">z 向上</text>

  <!-- 物体系 -->
  <text x="930" y="172" font-size="17" font-weight="bold" fill="#222">物体系（装甲板）</text>
  <text x="930" y="194" font-size="14" fill="#666">原点 = 板心</text>
  <g stroke-linecap="round" stroke-width="2.6" fill="none">
    <line x1="950" y1="300" x2="1070" y2="300" stroke="#d02a2a" marker-end="url(#ax)"/>
    <line x1="950" y1="300" x2="950" y2="420" stroke="#1f8a3c" marker-end="url(#ay)"/>
    <line x1="950" y1="300" x2="1040" y2="222" stroke="#2b5fd0" marker-end="url(#az)"/>
  </g>
  <circle cx="950" cy="300" r="4" fill="#222"/>
  <text x="1080" y="313" font-size="16" fill="#d02a2a">x 板右</text>
  <text x="938" y="442" font-size="16" fill="#1f8a3c">y 板下</text>
  <text x="1048" y="250" font-size="16" fill="#2b5fd0">z 指向板背</text>

  <text x="60" y="486" font-size="16" fill="#333">
    云台系取 <tspan font-weight="bold">x 前 / y 左 / z 上</tspan>，与弹道系（世界系）轴向相同，两系只差一个绕竖直轴的偏航角。
  </text>
  <text x="60" y="512" font-size="16" fill="#333">
    相机系是 右 / 下 / 前，与云台系不同向，所以旋转外参 R 不是单位阵，而是一个 90° 置换矩阵，见 (b)。
  </text>

  <line x1="60" y1="556" x2="1140" y2="556" stroke="#ccc" stroke-width="1"/>

  <!-- ================= (b) 原点关系 ================= -->
  <text x="60" y="596" font-size="20" font-weight="bold" fill="#111">
    (b) 相机系原点与云台系原点的关系
  </text>
  <text x="60" y="620" font-size="16" fill="#555">
    侧视图，从车的右侧看；x 向前画成图上向右，z 向上画成图上向上。本图按比例，1 mm = 3 px。
  </text>

  <!-- 云台系原点与参考轴 -->
  <g>
    <line x1="520" y1="860" x2="596" y2="860" stroke="#d02a2a"
          stroke-width="2.6" marker-end="url(#ax)"/>
    <text x="606" y="866" font-size="15" fill="#d02a2a">x 前</text>
    <line x1="520" y1="860" x2="520" y2="784" stroke="#2b5fd0"
          stroke-width="2.6" marker-end="url(#az)"/>
    <text x="530" y="780" font-size="15" fill="#2b5fd0">z 上</text>
    <circle cx="520" cy="860" r="9" fill="none" stroke="#111" stroke-width="2"/>
    <circle cx="520" cy="860" r="3" fill="#111"/>
    <line x1="504" y1="860" x2="536" y2="860" stroke="#111" stroke-width="1"/>
    <line x1="520" y1="844" x2="520" y2="876" stroke="#111" stroke-width="1"/>
    <text x="430" y="888" font-size="16" fill="#111" text-anchor="end">O 云台（P 轴）</text>
  </g>

  <!-- 相机系原点 -->
  <g>
    <circle cx="721" cy="706" r="6" fill="#111"/>
    <text x="735" y="688" font-size="16" fill="#111">O 相机（光心）</text>
  </g>

  <!-- 分解与平移向量 -->
  <g>
    <polyline points="520,860 721,860" fill="none"
              stroke="#999" stroke-width="1.6" stroke-dasharray="6 5"/>
    <polyline points="721,860 721,706" fill="none"
              stroke="#999" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="520" y1="860" x2="721" y2="706" stroke="#c08000"
          stroke-width="2.4" marker-end="url(#agray)"/>
    <text x="642" y="888" font-size="16" fill="#c08000" text-anchor="middle">
      前 67.11 mm
    </text>
    <text x="712" y="846" font-size="16" fill="#c08000" text-anchor="end">
      上 51.5 mm
    </text>
  </g>

  <!-- 右侧说明 -->
  <g font-size="16" fill="#c08000">
    <text x="790" y="730">t = O 相机 − O 云台</text>
    <text x="790" y="754">= (+0.06711, 0, +0.0515) m</text>
    <text x="790" y="778" font-size="14" fill="#777">
      y 分量为 0，相机横向居中，侧视图里看不出来
    </text>
  </g>
  <g font-size="15" fill="#333">
    <text x="790" y="836">旋转外参 R（相机系 → 云台系）：</text>
  </g>
  <g font-size="15" fill="#333" font-family="monospace">
    <text x="790" y="864">[  0  0  1 ]     相机 +z（前）落在云台系 +x</text>
    <text x="790" y="886">[ -1  0  0 ]     相机 +x（右）落在云台系 -y</text>
    <text x="790" y="908">[  0 -1  0 ]     相机 +y（下）落在云台系 -z</text>
  </g>

  <!-- ================= 脚注 ================= -->
  <line x1="60" y1="946" x2="1140" y2="946" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="972" font-size="14" fill="#555">
    轴序的依据：handout 同段给的「云台 P 轴到摩擦轮的向量 74.1, 0, 0」，枪口必然在正前方，所以那段数的第一个分量是「前」，
  </text>
  <text x="60" y="994" font-size="14" fill="#555">
    三个数读作 前 67.11 / 横向 0 / 上 51.5，相机在俯仰轴的前上方、横向居中。完整推导见 docs/上车前问题清单.md 第 1.1 节。
  </text>

</svg>

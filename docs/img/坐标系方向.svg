<?xml version="1.0" encoding="UTF-8"?>
<!--
  坐标轴方向图 —— 任务书 §3.5「在报告中画出坐标轴方向」。

  三个坐标系：相机系、云台系、物体系。
  数值全部取自 config/camera.yaml：
    内参加畸变      camera_matrix / distortion_coefficients
    云台系 <- 相机系   R = I（两系同向），t = (-0.06711, 0, -0.0515) m
  改 camera.yaml 里 t 那三个数，这张图上的标注也要跟着改。

  编辑方式：直接改这个 svg，然后跑同目录的 render.sh 重新导出 png。
  注意 XML 注释里不能出现连续两个减号，写分隔线用等号。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980"
     font-family="Noto Sans CJK SC, Noto Sans CJK HK, sans-serif">

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d02a2a"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f8a3c"/>
    </marker>
    <marker id="az" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd0"/>
    </marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="1200" height="980" fill="#ffffff"/>

  <!-- ================= 标题 ================= -->
  <text x="60" y="54" font-size="27" font-weight="bold" fill="#111">
    三个坐标系的方向与原点关系
  </text>
  <text x="60" y="84" font-size="16" fill="#555">
    任务书 §3.5「将相机坐标系结果转换至约定的云台 / 世界坐标系，并在报告中画出坐标轴方向」
  </text>
  <line x1="60" y1="102" x2="1140" y2="102" stroke="#ccc" stroke-width="1"/>

  <!-- ================= (a) 三个坐标系的轴向 ================= -->
  <text x="60" y="136" font-size="20" font-weight="bold" fill="#111">
    (a) 三个坐标系各轴的方向
  </text>

  <!-- 相机坐标系 -->
  <text x="170" y="172" font-size="17" font-weight="bold" fill="#222">相机坐标系</text>
  <text x="170" y="194" font-size="14" fill="#666">原点 = 相机光心</text>
  <g stroke-linecap="round" stroke-width="2.6" fill="none">
    <line x1="190" y1="300" x2="310" y2="300" stroke="#d02a2a" marker-end="url(#ax)"/>
    <line x1="190" y1="300" x2="190" y2="420" stroke="#1f8a3c" marker-end="url(#ay)"/>
    <line x1="190" y1="300" x2="280" y2="222" stroke="#2b5fd0" marker-end="url(#az)"/>
  </g>
  <circle cx="190" cy="300" r="4" fill="#222"/>
  <text x="320" y="313" font-size="16" fill="#d02a2a">x 向右</text>
  <text x="178" y="442" font-size="16" fill="#1f8a3c">y 向下</text>
  <text x="288" y="250" font-size="16" fill="#2b5fd0">z 沿光轴向前</text>

  <!-- 云台坐标系 -->
  <text x="560" y="172" font-size="17" font-weight="bold" fill="#222">云台坐标系</text>
  <text x="560" y="194" font-size="14" fill="#666">原点 = 云台旋转中心（P 轴）</text>
  <g stroke-linecap="round" stroke-width="2.6" fill="none">
    <line x1="580" y1="300" x2="700" y2="300" stroke="#d02a2a" marker-end="url(#ax)"/>
    <line x1="580" y1="300" x2="580" y2="420" stroke="#1f8a3c" marker-end="url(#ay)"/>
    <line x1="580" y1="300" x2="670" y2="222" stroke="#2b5fd0" marker-end="url(#az)"/>
  </g>
  <circle cx="580" cy="300" r="4" fill="#222"/>
  <text x="710" y="313" font-size="16" fill="#d02a2a">x 向右</text>
  <text x="568" y="442" font-size="16" fill="#1f8a3c">y 向下</text>
  <text x="678" y="250" font-size="16" fill="#2b5fd0">z 向前</text>

  <!-- 物体系 -->
  <text x="930" y="172" font-size="17" font-weight="bold" fill="#222">物体系（装甲板）</text>
  <text x="930" y="194" font-size="14" fill="#666">原点 = 板心</text>
  <g stroke-linecap="round" stroke-width="2.6" fill="none">
    <line x1="950" y1="300" x2="1070" y2="300" stroke="#d02a2a" marker-end="url(#ax)"/>
    <line x1="950" y1="300" x2="950" y2="420" stroke="#1f8a3c" marker-end="url(#ay)"/>
    <line x1="950" y1="300" x2="1040" y2="222" stroke="#2b5fd0" marker-end="url(#az)"/>
  </g>
  <circle cx="950" cy="300" r="4" fill="#222"/>
  <text x="1080" y="313" font-size="16" fill="#d02a2a">x 板右</text>
  <text x="938" y="442" font-size="16" fill="#1f8a3c">y 板下</text>
  <text x="1048" y="250" font-size="16" fill="#2b5fd0">z 指向板背</text>

  <text x="60" y="486" font-size="16" fill="#333">
    相机系与云台系的三条轴<b>方向完全相同</b>（旋转外参 R = I），两者只差一个原点平移，见 (b)。
  </text>
  <text x="60" y="512" font-size="16" fill="#333">
    物体系的 z 指向板背；板正对相机时物体系与相机系重合，于是角点顺序天然就是左上 右上 右下 左下。
  </text>

  <line x1="60" y1="534" x2="1140" y2="534" stroke="#ccc" stroke-width="1"/>

  <!-- ================= (b) 原点关系 ================= -->
  <text x="60" y="568" font-size="20" font-weight="bold" fill="#111">
    (b) 相机系与云台系的原点关系
  </text>
  <text x="60" y="592" font-size="16" fill="#555">
    俯视图，沿 y 轴向下看；x 向右、z 向前画成图上向上。<b>本图按比例</b>，1 mm = 3 px。
  </text>

  <!-- 装甲板（不按比例） -->
  <g>
    <rect x="600" y="612" width="420" height="26" fill="none"
          stroke="#999" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1032" y="632" font-size="14" fill="#777">装甲板</text>
    <text x="600" y="660" font-size="13" fill="#777">
      在 +z 约 1.5 m 处 —— 距离不按比例，只表示「在正前方」
    </text>
  </g>

  <!-- 云台系原点 -->
  <g>
    <line x1="760" y1="740" x2="930" y2="740" stroke="#d02a2a"
          stroke-width="2.6" marker-end="url(#ax)"/>
    <text x="940" y="745" font-size="16" fill="#d02a2a">x 向右</text>
    <line x1="760" y1="740" x2="760" y2="690" stroke="#2b5fd0"
          stroke-width="2.6" marker-end="url(#az)"/>
    <text x="768" y="686" font-size="16" fill="#2b5fd0">z 向前</text>
    <circle cx="760" cy="740" r="9" fill="none" stroke="#111" stroke-width="2"/>
    <circle cx="760" cy="740" r="3" fill="#111"/>
    <line x1="744" y1="740" x2="776" y2="740" stroke="#111" stroke-width="1"/>
    <line x1="760" y1="724" x2="760" y2="756" stroke="#111" stroke-width="1"/>
    <text x="778" y="768" font-size="16" fill="#111">O 云台（P 轴）</text>
  </g>

  <!-- 相机系原点 -->
  <g>
    <line x1="559" y1="895" x2="679" y2="895" stroke="#d02a2a"
          stroke-width="2.6" marker-end="url(#ax)"/>
    <text x="688" y="900" font-size="16" fill="#d02a2a">x</text>
    <line x1="559" y1="895" x2="559" y2="845" stroke="#2b5fd0"
          stroke-width="2.6" marker-end="url(#az)"/>
    <text x="568" y="858" font-size="16" fill="#2b5fd0">z</text>
    <circle cx="559" cy="895" r="5" fill="#111"/>
    <text x="330" y="920" font-size="16" fill="#111">O 相机（光心）</text>
  </g>

  <!-- 平移量与标注 -->
  <g>
    <polyline points="760,740 559,740 559,895" fill="none"
              stroke="#777" stroke-width="1.8" stroke-dasharray="7 5"/>
    <line x1="760" y1="740" x2="559" y2="895" stroke="#c08000"
          stroke-width="2.4" marker-end="url(#agray)"/>
    <text x="556" y="728" font-size="16" fill="#c08000" text-anchor="end">
      x 方向：67.11 mm（相机在云台左侧）
    </text>
    <text x="548" y="818" font-size="16" fill="#c08000" text-anchor="end">
      z 方向：51.5 mm
    </text>
    <text x="548" y="838" font-size="16" fill="#c08000" text-anchor="end">
      （相机在云台后方）
    </text>
    <text x="900" y="858" font-size="16" fill="#c08000">
      t = O 相机 − O 云台
    </text>
    <text x="900" y="882" font-size="16" fill="#c08000">
      = (−0.06711, 0, −0.0515) m
    </text>
    <text x="900" y="906" font-size="14" fill="#777">
      y 分量为 0，所以俯视图里看不出来
    </text>
  </g>

  <!-- ================= 脚注 ================= -->
  <line x1="60" y1="934" x2="1140" y2="934" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="956" font-size="14" fill="#a04000">
    ⚠ t 的正负号尚未与学长复核：本字段定义为「云台原点指向相机原点」，
    而 handout 给的三个数按「相机光心指向云台 P 轴」写，
  </text>
  <text x="60" y="975" font-size="14" fill="#a04000">
    两者方向相反，本图按 config/camera.yaml 的字段定义取负号。确认后改那三个数即可。
  </text>

</svg>
